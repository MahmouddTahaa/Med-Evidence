parser_engine: pymupdf
parser_profile: ocr_fallback
chunk:
  strategy_id: section_aware
  target_tokens: 400
  overlap_ratio: 0.12
  parent_tokens: 800
  child_tokens: 350
  max_tokens: 520
  prefix_section_title: true
embed:
  provider: sentence_transformers
  model_id: BAAI/bge-small-en-v1.5
  device: cuda
vector_store: chroma
retrieval:
  mode: hybrid
  top_k: 10
  keyword_method: bm25
  semantic_weight: 0.7
  keyword_weight: 0.3
  rrf_k: 60
  fetch_k: 20
  rerank: true
  rerank_model: cross-encoder/ms-marco-MiniLM-L-6-v2
  rerank_top_n: 20
  sibling_fill: false
  parent_child: false
